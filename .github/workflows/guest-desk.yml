name: Deploy the desk

# Deploys worker/ (sign-in, votes, remarks, guest edits) to Cloudflare, creating its
# database on the first run. Needs repository secrets:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID       Cloudflare
#   ARCHIVE_APP_ID, ARCHIVE_APP_PRIVATE_KEY            the GitHub App (files edits)
#   ARCHIVE_GH_CLIENT_ID, ARCHIVE_GH_CLIENT_SECRET     the same App, for "Sign in with GitHub"
#   ARCHIVE_X_CLIENT_ID, ARCHIVE_X_CLIENT_SECRET       optional: "Sign in with X"
#   ARCHIVE_ADMINS                                     optional: who may hide remarks, e.g. github:name

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/guest-desk.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the secrets are set
        id: ready
        env:
          A: ${{ secrets.ARCHIVE_APP_ID }}
        run: if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$A" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "Secrets not set yet; skipping."; fi
      - if: steps.ready.outputs.ok == '1'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Database
        if: steps.ready.outputs.ok == '1'
        working-directory: worker
        run: |
          W="npx -y wrangler@3"
          # report any failure as an annotation, so it is readable without the logs
          run() { if ! "$@" > out.txt 2>&1; then echo "::error title=$1 $2 $3 $4::$(tail -c 900 out.txt | tr '\n' ' ')"; cat out.txt; exit 1; fi; cat out.txt; }
          SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | python3 -c "import sys,json; d=json.load(sys.stdin); print((d.get('result') or {}).get('subdomain') or ('ERR ' + json.dumps(d.get('errors'))))")
          echo "::notice title=workers.dev subdomain::$SUB"
          run $W d1 list --json
          ID=$(python3 -c "import json; print(next((d.get('uuid') or d.get('database_id','') for d in json.load(open('out.txt')) if d.get('name')=='ubikistan-talk'), ''))" 2>/dev/null || true)
          if [ -z "$ID" ]; then run $W d1 create ubikistan-talk; run $W d1 list --json; ID=$(python3 -c "import json; print(next((d.get('uuid') or d.get('database_id','') for d in json.load(open('out.txt')) if d.get('name')=='ubikistan-talk'), ''))"); fi
          echo "::notice title=database::$ID"
          printf '\n[[d1_databases]]\nbinding = "DB"\ndatabase_name = "ubikistan-talk"\ndatabase_id = "%s"\n' "$ID" >> wrangler.toml
          run $W d1 execute ubikistan-talk --remote --file schema.sql
          run $W kv namespace list
          KV=$(python3 -c "import json; print(next((n['id'] for n in json.load(open('out.txt')) if n.get('title','').endswith('ubikistan-desk')), ''))" 2>/dev/null || true)
          if [ -z "$KV" ]; then run $W kv namespace create ubikistan-desk; run $W kv namespace list; KV=$(python3 -c "import json; print(next((n['id'] for n in json.load(open('out.txt')) if n.get('title','').endswith('ubikistan-desk')), ''))"); fi
          echo "::notice title=kv::$KV"
          printf '\n[[kv_namespaces]]\nbinding = "KV"\nid = "%s"\n' "$KV" >> wrangler.toml
          cat wrangler.toml
      - name: Deploy
        if: steps.ready.outputs.ok == '1'
        working-directory: worker
        run: |
          if ! npx -y wrangler@3 deploy > out.txt 2>&1; then echo "::error title=deploy::$(tail -c 900 out.txt | tr '\n' ' ')"; cat out.txt; exit 1; fi
          cat out.txt
          echo "::notice title=desk address::$(grep -o 'https://[^ ]*workers.dev' out.txt | head -1)"
      - name: Secrets
        if: steps.ready.outputs.ok == '1'
        working-directory: worker
        env:
          APP_ID: ${{ secrets.ARCHIVE_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.ARCHIVE_APP_PRIVATE_KEY }}
          GH_CLIENT_ID: ${{ secrets.ARCHIVE_GH_CLIENT_ID }}
          GH_CLIENT_SECRET: ${{ secrets.ARCHIVE_GH_CLIENT_SECRET }}
          X_CLIENT_ID: ${{ secrets.ARCHIVE_X_CLIENT_ID }}
          X_CLIENT_SECRET: ${{ secrets.ARCHIVE_X_CLIENT_SECRET }}
          ADMINS: ${{ secrets.ARCHIVE_ADMINS }}
        run: |
          for N in APP_ID APP_PRIVATE_KEY GH_CLIENT_ID GH_CLIENT_SECRET X_CLIENT_ID X_CLIENT_SECRET ADMINS; do
            V="${!N}"
            if [ -n "$V" ]; then printf '%s' "$V" | npx -y wrangler@3 secret put "$N" >/dev/null && echo "set $N"; fi
          done
