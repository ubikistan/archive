name: Deploy the desk

# Deploys worker/ (sign-in, votes, remarks, guest edits) to Cloudflare, creating its
# database on the first run. Needs repository secrets:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID       Cloudflare
#   ARCHIVE_APP_ID, ARCHIVE_APP_PRIVATE_KEY            the GitHub App (files edits)
#   ARCHIVE_GH_CLIENT_ID, ARCHIVE_GH_CLIENT_SECRET     the same App, for "Sign in with GitHub"
#   ARCHIVE_X_CLIENT_ID, ARCHIVE_X_CLIENT_SECRET       optional: "Sign in with X"
#   ARCHIVE_ADMINS                                     optional: who may hide remarks, e.g. github:name

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/guest-desk.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the secrets are set
        id: ready
        env:
          A: ${{ secrets.ARCHIVE_APP_ID }}
        run: if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$A" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "Secrets not set yet; skipping."; fi
      - if: steps.ready.outputs.ok == '1'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Database
        if: steps.ready.outputs.ok == '1'
        working-directory: worker
        run: |
          W="npx -y wrangler@3"
          find_id() { $W d1 list --json | python3 -c "import sys,json; print(next((d.get('uuid') or d.get('database_id','') for d in json.load(sys.stdin) if d.get('name')=='ubikistan-talk'), ''))"; }
          ID=$(find_id)
          if [ -z "$ID" ]; then $W d1 create ubikistan-talk; ID=$(find_id); fi
          printf '\n[[d1_databases]]\nbinding = "DB"\ndatabase_name = "ubikistan-talk"\ndatabase_id = "%s"\n' "$ID" >> wrangler.toml
          $W d1 execute ubikistan-talk --remote --file schema.sql
      - name: Deploy
        if: steps.ready.outputs.ok == '1'
        working-directory: worker
        run: npx -y wrangler@3 deploy
      - name: Secrets
        if: steps.ready.outputs.ok == '1'
        working-directory: worker
        env:
          APP_ID: ${{ secrets.ARCHIVE_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.ARCHIVE_APP_PRIVATE_KEY }}
          GH_CLIENT_ID: ${{ secrets.ARCHIVE_GH_CLIENT_ID }}
          GH_CLIENT_SECRET: ${{ secrets.ARCHIVE_GH_CLIENT_SECRET }}
          X_CLIENT_ID: ${{ secrets.ARCHIVE_X_CLIENT_ID }}
          X_CLIENT_SECRET: ${{ secrets.ARCHIVE_X_CLIENT_SECRET }}
          ADMINS: ${{ secrets.ARCHIVE_ADMINS }}
        run: |
          for N in APP_ID APP_PRIVATE_KEY GH_CLIENT_ID GH_CLIENT_SECRET X_CLIENT_ID X_CLIENT_SECRET ADMINS; do
            V="${!N}"
            if [ -n "$V" ]; then printf '%s' "$V" | npx -y wrangler@3 secret put "$N" >/dev/null && echo "set $N"; fi
          done
