name: World State post

on:
  schedule:
    - cron: "20 * * * *"   # every hour: the edition when it lands, the forecasts it issues, what settles
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print, do not post"
        type: boolean
      say:
        description: "Post a written thread instead (a file under tools/posts/, e.g. tools/posts/pinned.txt)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: worldstate-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests-oauthlib pillow fonttools brotli
      - name: Compose (and post, when the keys are set)
        env:
          WS_X_API_KEY: ${{ secrets.WS_X_API_KEY }}
          WS_X_API_SECRET: ${{ secrets.WS_X_API_SECRET }}
          WS_X_ACCESS_TOKEN: ${{ secrets.WS_X_ACCESS_TOKEN }}
          WS_X_ACCESS_SECRET: ${{ secrets.WS_X_ACCESS_SECRET }}
          UBIK_KEY: ${{ secrets.UBIK_KEY }}
          DRY: ${{ inputs.dry_run }}
          SAY: ${{ inputs.say }}
        run: |
          SAYARG=""; if [ -n "$SAY" ] && [ "$SAY" != "false" ]; then SAYARG="--say $SAY"; fi
          if [ -n "$WS_X_API_KEY" ] && [ "$DRY" != "true" ]; then python3 tools/worldstate.py --post $SAYARG; else python3 tools/worldstate.py $SAYARG; echo "(not posted: no keys, or dry run)"; fi
      - name: Remember what was posted
        run: |
          if ! git diff --quiet tools/worldstate.log pages/parts/snapshot/; then
            git config user.name Administrator; git config user.email administrator@ubikistan.invalid
            git add tools/worldstate.log pages/parts/snapshot/
            MSG="World State post: $(tail -1 tools/worldstate.log | cut -f1,2)"
            if git diff --quiet tools/worldstate.log; then MSG="World State: sync snapshots"; fi
            git commit -m "$MSG"
            git pull --rebase -q origin main && git push
          fi
