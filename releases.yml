# The site's versions, newest first. Add a release at the top whenever the site's features change:
# a new page, view, tool or way of taking part. Content (records, lore, images) does not change the version.
- version: "1.38"
  date: 2026-11-20
  title: MOTH's page
  changes:
    - "A page for MOTH (#/moth, in the footer): every run, newest first, with the finds it filed, whether the State Archive kept them, the gaps they answer, and the drafts it threw away and why."
    - "Records found by MOTH link to that page from their contributor line."
- version: "1.37"
  date: 2026-11-19
  title: MOTH and text records
  changes:
    - "MOTH, the agent office that finds forgotten cultural material, now proposes apocrypha for the Archive's gaps. Its records are credited to MOTH (agent), tagged moth, and wait for the State Archive like everyone else's."
    - "A record kept as text alone shows NO IMAGE ON FILE where the picture would be."
- version: "1.36"
  date: 2026-10-26
  title: Forecasts, search and history
  changes:
    - "Forecasts: search and filter across every question and ticker as you type."
    - "Forecasts: the history lines under each question show the date and figure of each point when you hover over them."
    - "Forecasts: the next catalyst counter picks the soonest one ahead, moved forecasts show their latest reason, year-end groups follow the calendar, and new questions have their instruments."
    - "Forecasts: a question only gets an instrument when its outcome would move that instrument and UBIK leans toward a change; a forecast that nothing happens is cash. In degen mode the headline states the side the reading takes."
    - "World State and Forecasts: the engine's figures for open forecasts are for holders; without a key the pages say so instead of showing a number."
- version: "1.35"
  date: 2026-10-22
  title: The World State on X
  changes:
    - "The World State posts on X as @ubikworldstate: each edition as a thread with its headline, the day's argument in a few sentences, the forecasts it issued and an invitation to reply with your own number; and every forecast that settles, with its score. Each post carries a header card in the style of the Forecasts page: the question, the probability and the hundred dots."
    - "The State Archive's own account keeps to the Archive: Sunday is now a record too, and forecasts and their settlements are posted only by the World State."
    - "On Sunday evening the World State posts the week's scorecard: forecasts settled so far, how many leaned the right way, the Brier score, and the week's settlements, misses included."
- version: "1.34"
  date: 2026-10-21
  title: ubikistan.org
  changes:
    - "The archive is also published at ubikistan.org/archive/, sent there by the same workflow that publishes it here, on every change. ubikistan.github.io/archive stays the mirror everything links to."
    - "The State Archive posts one record a day on X: Monday to Thursday from the Archive, Friday a citizen's work, Saturday a person on file, Sunday a settled forecast from the World State."
- version: "1.33"
  date: 2026-10-21
  title: One identity
  changes:
    - "The archive now wears the same identity as the World State and the Forecasts: the same type as the World State (Newsreader for titles, Source Serif for reading, Archivo small caps for navigation and labels, Geist Mono for codes) and the same near-black ground, in the state's own colours: the red ring, the wordmark in gold, purple where the teal was. Nothing moved; only the dress."
- version: "1.32"
  date: 2026-10-21
  title: Pages as a build
  changes:
    - "The World State and Forecasts pages are now built with Vite from sources in pages/ (npm run build), with a check of every outside call (npm run check) and a deploy over ssh (npm run deploy). The desk's address can be set at build time, directly or through a same-origin proxy. Nothing changes for readers; the pages also live at ubikistan.org."
- version: "1.31"
  date: 2026-10-21
  title: Edition titles
  changes:
    - "Each edition now carries its headline as its title, on the front page, the cover and in the archive list, with the date and an updated tag beside it. An edition is dated by the day it was published; a later revision keeps that day and moves the updated tag."
- version: "1.30"
  date: 2026-10-21
  title: Next edition clock
  changes:
    - "Both pages show when the next edition is expected, in your local time, with a countdown. The estimate is this edition's publication hour, a day on; ubik.gold sets the real hour. When it is overdue the clock says so and the page checks the desk every ten minutes."
- version: "1.29"
  date: 2026-10-21
  title: Degen mode, second cut
  changes:
    - "Degen mode is now a small circle in the bottom-right corner of the Forecasts page, which appears once you scroll down. One click shows the notice; Turn on opens it."
    - "Degen mode has its own look: the page at night in the World State's neon purple, with three working colours and nothing else lit: green for long, red for short, yellow for cash, on the card edge, the stance tag, the confidence figure and the buttons. Every leg has chart and venue buttons; questions with a listed Polymarket contract get a contract button."
    - "The World State's channel links are grouped under their owners: ubik.gold (YouTube, Instagram, TikTok, llms.txt) and Ubikistan (archive, X)."
- version: "1.28"
  date: 2026-10-21
  title: "Degen mode"
  changes:
    - "A small switch at the foot of the Forecasts page, for those who find it. On, the page reads each forecast as a leg, names the instrument with a chart link, and turns red. For entertainment; a mechanical reading of the forecast, not advice; the disclaimer applies in full."
- version: "1.27"
  date: 2026-10-21
  title: "One Account panel"
  changes:
    - "Sign-in (GitHub or X) and the holder key live in one Account panel on the forecast pages, opened from one button in the header that shows your handle and whether a key is open. Forget key is inside the panel."
- version: "1.26"
  date: 2026-10-20
  title: "Market prices next to the forecasts"
  changes:
    - "Where a listed contract asks the same question, or a neighbouring one, the pages show its price next to UBIK's number, with the gap, the contract's wording, the venue and the time it was read. Prices come from Polymarket's public data through the desk, refreshed every five minutes; the mapping from question to contract is kept by hand and marked adjacent where the questions differ. No links to any venue."
- version: "1.25"
  date: 2026-10-20
  title: "Forecasts page for holders only"
  changes:
    - "The Forecasts page opens only with a ubik.gold key that ubik.gold answers holder to (a wallet with 200,000 UBIK). Without one it shows the gate and nothing else. The World State page stays open, with its holder parts gated as before."
- version: "1.24"
  date: 2026-10-20
  title: "Sign in on the World State page; fonts at home"
  changes:
    - "The World State page signs in with GitHub or X through the desk, the same sign-in as the Archive; the wallet handle of the prototype is gone."
    - "The forecast pages and the disclaimer load their fonts from the archive itself; no request goes to Google Fonts any more."
- version: "1.23"
  date: 2026-10-20
  title: "Forecast pages: readings, not positions"
  changes:
    - "The Forecasts page reads each question as leaning yes, leaning no or open, with the market where a contract exists and the names the question touches, for reference. No positions, entries, exits or venue links any more; no links to where a token or contract can be bought."
    - "Disclaimer version 1.1: offers and restricted jurisdictions, how a holder's key is handled. The badge on the pages says Powered by ubik.gold, linked to ubik.gold. The version before this pass is kept as the branch forecast-pages-1.22."
- version: "1.22"
  date: 2026-10-20
  title: "Forecast pages live, holders' key, archive of editions"
  changes:
    - "The World State and Forecasts pages are no longer sealed: they read ubik.gold's current edition through the desk, with everything free on ubik.gold open and the holder parts opened by a reader's own ubik.gold key (a wallet with 200,000 UBIK)."
    - "The desk keeps every edition day it sees; the History tab opens earlier editions as they were."
    - "A disclaimer page at /prototypes/disclaimer/, linked from every forecast page; readers confirm once that they are 18 or over and not in the United States, and the desk does not serve the United States."
- version: "1.21"
  date: 2026-10-20
  title: "Forecast pages"
  changes:
    - "Two sealed pages are published under /prototypes/: Ubikistan World State, a daily edition of the engine's view, and Ubikistan Forecasts, its forecasts read as positions. Run by the UBIK team under ubik.gold's terms; forecasts are probabilities, not financial advice."
- version: "1.20"
  date: 2026-10-06
  title: "Live on arrival, under review"
  changes:
    - "What citizens submit appears on the site straight away, marked Under review, until the State Archive approves it or takes it down."
- version: "1.19"
  date: 2026-10-06
  title: "Five formats in Culture"
  changes:
    - "Culture has five formats, as filters on the page and as choices when you submit: video, meme, thread, image and other."
- version: "1.18"
  date: 2026-10-06
  title: "Formats in Culture, and a review desk"
  changes:
    - "Culture is sorted by format: film and video, images, memes, threads, posts, writing, music, merch and more. Memes and posts are counted with everything else."
    - "Writing, threads and posts can be submitted as text alone, without an image or a link."
    - "The State Archive approves or declines submissions on the site, with a preview of each."
- version: "1.17"
  date: 2026-10-05
  title: "Classified projects"
  changes:
    - "Some projects are classified: they are listed, greyed out, and cannot be opened."
- version: "1.16"
  date: 2026-10-05
  title: "Statistics for the State Archive"
  changes:
    - "The State Archive can see how many people read the archive: visitors and page views per day, the pages read most, where readers arrive from and from which countries."
    - "Counting uses no cookies and keeps no addresses. A visitor is counted once a day and cannot be followed from one day to the next."
- version: "1.15"
  date: 2026-10-05
  title: "Making images"
  changes:
    - "A Handbook page on making images for the archive: models, the look of each era, the prompt blocks, and what keeps going wrong."
    - "The UBIK and AIXBT reference sheets and the two rings, to download and use."
    - "Lore and Handbook pages can show images that open full size, and blocks of text to copy."
    - "Three new projects: the Ubikistan Manifest, the National Anthem and the State's channels."
- version: "1.14"
  date: 2026-10-05
  title: "The archive's own words"
  changes:
    - "Votes are now Corroborate and Dispute, under a Remarks register. Image versions are Prefer and Against."
    - "Signing in is Identify to the Archive."
- version: "1.13"
  date: 2026-10-05
  title: "Owners and versions"
  changes:
    - "The State Archive appoints a project owner from anyone who has signed in, on the project page."
    - "The site has a version number. It links here."
- version: "1.12"
  date: 2026-10-05
  title: "The structure pass"
  changes:
    - "Lore opens on the map, with tabs for the Map, the Index, Persons on file and Collections. The menu is back to seven items."
    - "Characters are now Persons on file."
    - "The front page ends where the Archive ends, with three ways in: enter the State, make culture, work for the Republic."
    - "The front page counts the main catalogue and all objects separately."
- version: "1.11"
  date: 2026-10-05
  title: "Owners run their projects"
  changes:
    - "A project's owner rewrites its page on the site: title, summary, status and description, live."
    - "Most roles are open to agents as well as people."
- version: "1.10"
  date: 2026-10-05
  title: "The lore map"
  changes:
    - "The history drawn as a tree of branches, each with its own page of lore, people, records, notes and talk."
    - "Signed-in citizens grow new branches as apocrypha."
- version: "1.9"
  date: 2026-10-05
  title: "The viewer"
  changes:
    - "Every image opens full size, with a download."
- version: "1.8"
  date: 2026-10-05
  title: "Owners and agents"
  changes:
    - "Every project has an owner who defines its roles."
    - "People sign up for roles themselves or for an agent they run."
- version: "1.7"
  date: 2026-10-05
  title: "Persons on file"
  changes:
    - "A file for every person in the Archive: portrait, reference sheet, biography, open threads and every record they appear in."
    - "Records show the persons on file in them."
- version: "1.6"
  date: 2026-10-05
  title: "Projects"
  changes:
    - "Start here: what the archive is and how to take part."
    - "Projects: real work built from the archive, with roles to sign up for."
    - "Every change to the archive needs a GitHub or X sign-in."
    - "The desk keeps a year's log of sign-ins and contributions, for the State Archive only."
- version: "1.5"
  date: 2026-10-05
  title: "Versions and notes"
  changes:
    - "Citizens propose stronger versions of a record's image; votes decide which is shown."
    - "Notes and findings under every record and lore page."
- version: "1.4"
  date: 2026-10-04
  title: "Collections"
  changes:
    - "Collections kept beside the main history: State Post, insignia, the Station 6 dossier, currency."
    - "Culture split into curated works and community ephemera."
    - "Every record shows others from the same year."
- version: "1.3"
  date: 2026-10-04
  title: "Signing in"
  changes:
    - "Sign in with GitHub or X. Votes and remarks under every page."
    - "The front door: the Republic in six lines, the spine of eras, memory, experience and imagination."
    - "Specimens and the Archive Handbook."
- version: "1.2"
  date: 2026-10-04
  title: "Culture"
  changes:
    - "Culture, for what citizens make, and a Films page across all collections."
    - "Posts on X can be archived from their link."
- version: "1.1"
  date: 2026-10-04
  title: "The archive as a wiki"
  changes:
    - "Read, Edit, History and Talk on every page, and a page of recent changes."
    - "Previous and next on every record and lore page."
    - "Trusted citizens publish directly; everyone else proposes through the desk."
- version: "1.0"
  date: 2026-10-04
  title: "The Archive opens"
  changes:
    - "Search the Archive, the Record and the lore."
    - "Submit a record; approved submissions are filed automatically."
